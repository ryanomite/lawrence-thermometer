<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawrence Office Temperature Monitor</title>
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .temperature-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .temperature {
            font-size: 72px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
        }

        .temperature-label {
            font-size: 18px;
            opacity: 0.9;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-size: 14px;
            color: #666;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background: #4CAF50;
        }

        .status-dot.disconnected {
            background: #f44336;
            animation: none;
        }

        .status-dot.connecting {
            background: #FFC107;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            position: relative;
            height: 300px;
            margin: 30px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #eee;
        }

        .info-item {
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
        }

        .loading {
            color: #666;
            font-style: italic;
        }

        footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #999;
        }

        footer a {
            color: #667eea;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .temperature {
                font-size: 48px;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 Lawrence Office</h1>
        <div class="subtitle">Temperature Monitor</div>

        <div class="status-indicator">
            <div class="status-dot connecting" id="statusDot"></div>
            <span id="statusText">Connecting to MQTT...</span>
        </div>

        <div class="temperature-display">
            <div class="temperature" id="temperature">
                <span class="loading">--.-</span>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="temperatureChart"></canvas>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Last Updated</div>
                <div class="info-value" id="lastUpdate">Never</div>
            </div>
            <div class="info-item">
                <div class="info-label">Device IP (sliderule)</div>
                <div class="info-value" id="deviceIP">Unknown</div>
            </div>
            <div class="info-item">
                <div class="info-label">Min (24h)</div>
                <div class="info-value" id="minTemp">--</div>
            </div>
            <div class="info-item">
                <div class="info-label">Max (24h)</div>
                <div class="info-value" id="maxTemp">--</div>
            </div>
        </div>

        <footer>
            Powered by <a href="https://www.hivemq.com/" target="_blank">HiveMQ</a> MQTT Broker
            <br>
            <small>Topics: adc-lawrence/temperature &amp; adc-lawrence/temperature-history</small>
        </footer>
    </div>

    <script>
        // MQTT Configuration
        const MQTT_BROKER = 'wss://broker.hivemq.com:8884/mqtt';
        const TOPIC_TEMP = 'adc-lawrence/temperature';
        const TOPIC_IP = 'adc-lawrence/ip';
        const TOPIC_HISTORY = 'adc-lawrence/temperature-history';

        // UI Elements
        const temperatureEl = document.getElementById('temperature');
        const statusDotEl = document.getElementById('statusDot');
        const statusTextEl = document.getElementById('statusText');
        const lastUpdateEl = document.getElementById('lastUpdate');
        const deviceIPEl = document.getElementById('deviceIP');
        const minTempEl = document.getElementById('minTemp');
        const maxTempEl = document.getElementById('maxTemp');

        // State
        let lastUpdateTime = null;
        let chart = null;
        let temperatureData = [];
        let latestTempRounded = null;

        // Initialize Chart.js
        function initChart() {
            const ctx = document.getElementById('temperatureChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Temperature (°F)',
                        data: [],
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            title: {
                                display: true,
                                text: 'Temperature (°F)'
                            }
                        },
                        x: {
                            display: true
                        }
                    }
                }
            });
        }

        // Parse history data and update chart
        function updateChartFromHistory(historyJson) {
            try {
                // Parse the JSON without quotes (format: {timestamp:temp,timestamp:temp})
                const historyStr = historyJson.toString();
                const pairs = historyStr.slice(1, -1).split(',');
                
                temperatureData = [];
                const now = Date.now() / 1000;
                
                pairs.forEach(pair => {
                    const [timestampStr, tempStr] = pair.split(':');
                    const timestamp = parseInt(timestampStr);
                    const temp = parseFloat(tempStr);
                    
                    if (!isNaN(timestamp) && !isNaN(temp)) {
                        temperatureData.push({
                            timestamp: timestamp,
                            temperature: temp
                        });
                    }
                });
                
                // Sort by timestamp
                temperatureData.sort((a, b) => a.timestamp - b.timestamp);
                
                // Update chart
                updateChart();
                
                console.log(`Updated chart with ${temperatureData.length} data points`);
            } catch (e) {
                console.error('Error parsing history:', e);
            }
        }

        // Update chart display
        function updateChart() {
            if (!chart || temperatureData.length === 0) return;
            
            const labels = temperatureData.map(d => {
                const date = new Date(d.timestamp * 1000);
                return date.toLocaleString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            });
            
            const temps = temperatureData.map(d => d.temperature);
            
            chart.data.labels = labels;
            chart.data.datasets[0].data = temps;
            chart.update();
            
            // Update min/max display
            updateMinMaxDisplay();
        }

        // Update min/max for last 24 hours with latest-temp override
        function updateMinMaxDisplay() {
            const oneDayAgo = (Date.now() / 1000) - (24 * 3600);
            const last24h = temperatureData.filter(d => d.timestamp >= oneDayAgo);
            
            if (last24h.length > 0) {
                const temps24h = last24h.map(d => d.temperature);
                let min24h = Math.min(...temps24h);
                let max24h = Math.max(...temps24h);

                // If latest temperature (rounded) exceeds min/max, display that value
                if (latestTempRounded !== null) {
                    if (latestTempRounded < min24h) {
                        min24h = latestTempRounded;
                    }
                    if (latestTempRounded > max24h) {
                        max24h = latestTempRounded;
                    }
                }

                minTempEl.textContent = min24h.toFixed(1) + '°';
                maxTempEl.textContent = max24h.toFixed(1) + '°';
            }
        }

        // Connect to MQTT broker
        console.log('Connecting to HiveMQ broker via WebSocket...');
        const client = mqtt.connect(MQTT_BROKER, {
            clientId: 'lawrence-web-' + Math.random().toString(16).substr(2, 8),
            clean: true,
            reconnectPeriod: 5000,
        });

        // Connection established
        client.on('connect', () => {
            console.log('Connected to MQTT broker');
            updateStatus('connected', 'Connected');
            
            // Subscribe to topics
            client.subscribe([TOPIC_TEMP, TOPIC_IP, TOPIC_HISTORY], (err) => {
                if (err) {
                    console.error('Subscription error:', err);
                    updateStatus('disconnected', 'Subscription failed');
                } else {
                    console.log('Subscribed to topics');
                }
            });
        });

        // Message received
        client.on('message', (topic, message) => {
            const payload = message.toString();
            console.log(`Received message on ${topic}:`, payload);

            if (topic === TOPIC_TEMP) {
                updateTemperature(payload);
            } else if (topic === TOPIC_IP) {
                updateDeviceIP(payload);
            } else if (topic === TOPIC_HISTORY) {
                updateChartFromHistory(payload);
            }
        });

        // Connection errors
        client.on('error', (err) => {
            console.error('MQTT error:', err);
            updateStatus('disconnected', 'Connection error');
        });

        // Disconnected
        client.on('close', () => {
            console.log('Disconnected from MQTT broker');
            updateStatus('disconnected', 'Disconnected');
        });

        // Reconnecting
        client.on('reconnect', () => {
            console.log('Reconnecting to MQTT broker...');
            updateStatus('connecting', 'Reconnecting...');
        });

        // Update temperature display
        function updateTemperature(temp) {
            const tempValue = parseFloat(temp);
            
            if (isNaN(tempValue)) {
                temperatureEl.innerHTML = '<span class="loading">Error</span>';
                return;
            }

            // Format temperature with 1 decimal place
            temperatureEl.textContent = tempValue.toFixed(1) + '°';

            // Track latest rounded temperature for min/max override
            latestTempRounded = Math.round(tempValue);
            
            // Update last update time
            lastUpdateTime = new Date();
            updateLastUpdateDisplay();
            
            // Start interval to update "time ago" display
            if (!window.updateInterval) {
                window.updateInterval = setInterval(updateLastUpdateDisplay, 1000);
            }

            // Update min/max in case history hasn't changed
            updateMinMaxDisplay();
        }

        // Update device IP display
        function updateDeviceIP(ip) {
            deviceIPEl.innerHTML = '<a href="http://' + ip + '/" target="_blank" style="color: #333; text-decoration: none; border-bottom: 1px dotted #999;">' + ip + '</a>';
        }

        // Update status indicator
        function updateStatus(status, text) {
            statusDotEl.className = 'status-dot ' + status;
            statusTextEl.textContent = text;
        }

        // Update "last updated" display
        function updateLastUpdateDisplay() {
            if (!lastUpdateTime) {
                lastUpdateEl.textContent = 'Never';
                return;
            }

            const now = new Date();
            const diffSeconds = Math.floor((now - lastUpdateTime) / 1000);

            if (diffSeconds < 60) {
                lastUpdateEl.textContent = diffSeconds + 's ago';
            } else if (diffSeconds < 3600) {
                const minutes = Math.floor(diffSeconds / 60);
                lastUpdateEl.textContent = minutes + 'm ago';
            } else {
                const hours = Math.floor(diffSeconds / 3600);
                lastUpdateEl.textContent = hours + 'h ago';
            }
        }

        // Initialize chart on page load
        window.addEventListener('load', () => {
            initChart();
        });
    </script>
</body>
</html>
